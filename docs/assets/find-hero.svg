<svg width="1440" height="420" viewBox="0 0 1440 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#082F2D"/>
      <stop offset="0.5" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="glow" x1="170" y1="60" x2="1180" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CCFBF1" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1440" height="420" rx="28" fill="url(#bg)"/>

  <circle cx="170" cy="95" r="110" fill="#99F6E4" fill-opacity="0.18" filter="url(#blur)">
    <animate attributeName="r" values="95;120;95" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1260" cy="330" r="130" fill="#FDE68A" fill-opacity="0.14" filter="url(#blur)">
    <animate attributeName="r" values="118;145;118" dur="7s" repeatCount="indefinite"/>
  </circle>

  <path d="M215 282C340 194 478 270 617 200C755 130 865 172 1014 118C1112 82 1195 108 1242 145"
        stroke="url(#glow)" stroke-width="6" stroke-linecap="round" stroke-dasharray="18 16">
    <animate attributeName="stroke-dashoffset" values="0;-136" dur="4s" repeatCount="indefinite"/>
  </path>

  <circle cx="215" cy="282" r="14" fill="#CCFBF1"/>
  <circle cx="617" cy="200" r="14" fill="#CCFBF1"/>
  <circle cx="1014" cy="118" r="14" fill="#FDE68A"/>
  <circle cx="1242" cy="145" r="14" fill="#FDE68A"/>

  <g>
    <circle cx="215" cy="282" r="28" stroke="#CCFBF1" stroke-opacity="0.65" stroke-width="3">
      <animate attributeName="r" values="18;34;18" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="617" cy="200" r="28" stroke="#CCFBF1" stroke-opacity="0.65" stroke-width="3">
      <animate attributeName="r" values="18;34;18" dur="2.6s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="2.6s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1014" cy="118" r="28" stroke="#FDE68A" stroke-opacity="0.65" stroke-width="3">
      <animate attributeName="r" values="18;34;18" dur="2.6s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="2.6s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="430" y="96" width="580" height="228" rx="28" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.2"/>
  <text x="720" y="178" fill="white" font-size="58" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">Find</text>
  <text x="720" y="226" fill="#CCFBF1" font-size="28" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Lost • Stolen • Found</text>
  <text x="720" y="268" fill="white" fill-opacity="0.88" font-size="22" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Kurdish Sorani • RTL-first • Community-powered</text>
